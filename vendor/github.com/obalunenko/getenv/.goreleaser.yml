version: 2

release:
  github:
    owner: obalunenko
    name: getenv
  footer: |
    **Full Changelog**: https://github.com/obalunenko/getenv/compare/{{ .PreviousTag }}...{{ .Tag }}

builds:
  - skip: true

snapshot:
  version_template: SNAPSHOT-{{ .Commit }}

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^dev:"
      - "README"
      - "^readme"
      - "^scripts"
      - "scripts:"
      - Merge pull request
      - Merge branch
      - Rebase on master
      - "^Makefile"
      - "goreleaser"
  groups:
    - title: 'New Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 10
    - title: Other work
      order: 999

milestones:
  - close: true
