version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    assignees:
      - "obalunenko"
    reviewers:
      - "obalunenko"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    assignees:
      - "obalunenko"
    reviewers:
      - "obalunenko"
    commit-message:
      prefix: "chore"
      include: "scope"


  - package-ecosystem: "gomod"
    directories:
      - "/tools/*"
    schedule:
      interval: "daily"
    # go.mod marks tool modules as indirect, so list them by name: this bumps
    # the tools and leaves their own dependencies alone.
    allow:
      - dependency-name: "github.com/axw/gocov"
      - dependency-name: "github.com/golangci/golangci-lint/v2"
      - dependency-name: "github.com/goreleaser/goreleaser/v2"
      - dependency-name: "github.com/matm/gocov-html"
      - dependency-name: "github.com/obalunenko/coverbadger"
      - dependency-name: "golang.org/x/tools"
      - dependency-name: "gotest.tools/gotestsum"
      - dependency-name: "mvdan.cc/gofumpt"
    groups:
      tools:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "go"
    assignees:
      - "obalunenko"
    reviewers:
      - "obalunenko"
    commit-message:
      prefix: "chore"
      include: "scope"